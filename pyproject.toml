[project]
name = "aio-tests-mcp-server"
dynamic = ["version"]
description = "Model Context Protocol (MCP) server for AIO Tests, the test management app for Jira. Lets AI assistants search, read, create and update test cases, folders and tags on Jira Cloud and Server/Data Center."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
keywords = ["mcp", "model-context-protocol", "aio-tests", "jira", "test-management", "qa", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests[socks]>=2.31.0",
    "mcp>=1.8.0,<2.0.0",
    "fastmcp>=2.13.0,<2.15.0",
    "pydantic>=2.10.6,<2.12.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "uvicorn>=0.27.1",
    "starlette>=0.49.1",
    "urllib3>=2.6.3",
]

[[project.authors]]
name = "Amir Hossein Hanifehzadeh"

[project.urls]
Homepage = "https://github.com/AmirhosseinHanifehzadeh/aio-tests-mcp"
Repository = "https://github.com/AmirhosseinHanifehzadeh/aio-tests-mcp"
Issues = "https://github.com/AmirhosseinHanifehzadeh/aio-tests-mcp/issues"

[project.scripts]
aio-tests-mcp-server = "aio_tests_mcp_server:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    # Drives the server's Streamable HTTP transport in the integration tests.
    "httpx>=0.27.0",
    "pre-commit>=3.6.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aio_tests_mcp_server"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "ANN", "S", "BLE", "FBT", "C4", "DTZ", "T10", "EM", "ISC", "ICN"]
# FBT001/FBT002: boolean flags are part of the MCP tool schema and the CLI
# surface, where they are always passed by keyword.
ignore = ["ANN401", "EM101", "EM102", "FBT001", "FBT002"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "B017"]
"tests/fixtures/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
