name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no API token stored in the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The registry serves whatever server.json claims, and a PyPI version is
      # permanent once uploaded. A manifest left on the previous version points
      # clients at a package that was never published, so fail before the
      # upload rather than after it.
      - name: Check server.json matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          manifest=$(jq -r .version server.json)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "release tag $tag does not match server.json version $manifest"
            exit 1
          fi
          echo "server.json is at $manifest, matching $tag"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    # Lists the server in the official MCP registry so MCP clients can find it.
    # Runs after PyPI, because the registry verifies the published package.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Publish to the MCP registry
        uses: modelcontextprotocol/registry/.github/actions/publish@main
