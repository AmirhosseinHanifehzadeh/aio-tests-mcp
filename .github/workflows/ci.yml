name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # uv-dynamic-versioning reads git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Verify the server starts
        run: |
          uv run --with dist/*.whl --no-project aio-tests-mcp-server --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --build-arg VERSION=0.0.0 -t aio-tests-mcp-server:ci .

      # The wheel check above cannot catch a broken image layout, so the
      # container itself has to start and answer.
      - name: Verify the entry point runs in the image
        run: docker run --rm --entrypoint aio-tests-mcp-server aio-tests-mcp-server:ci --version

      - name: Verify the HTTP transport serves /healthz
        run: |
          docker run -d --name aio-ci -p 8000:8000 aio-tests-mcp-server:ci \
            --transport streamable-http --host 0.0.0.0 --port 8000
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo "\nhealthy"; docker rm -f aio-ci; exit 0
            fi
            sleep 2
          done
          echo "server never became healthy"; docker logs aio-ci; docker rm -f aio-ci; exit 1
